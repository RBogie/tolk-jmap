name: Scorecard

# OpenSSF Scorecard: rates the repository's security practices (pinned
# dependencies, token permissions, branch protection, signed releases, ...).
# Findings appear under Security, Code scanning; the published score feeds
# the README badge (https://scorecard.dev/viewer/?uri=github.com/RBogie/tolk-jmap).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # Re-scores when branch protection changes.
  branch_protection_rule:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # reading the workflow runs it scores
      security-events: write # uploading the findings to code scanning
      id-token: write # publishing the score for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
