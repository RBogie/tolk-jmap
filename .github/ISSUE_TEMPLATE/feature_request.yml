name: Feature request
description: Something Tolk should do that it does not yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like
      description: What you are trying to do, and what is missing.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Mail app, JMAP server, or anything else that matters.
