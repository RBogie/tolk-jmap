# cargo deny check: known vulnerabilities, licenses and crate sources.

[advisories]
yanked = "deny"

[licenses]
# Licenses allowed for dependencies; all are compatible with the crate's
# own AGPL-3.0-only (which cargo deny does not check, publish = false).
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
