[package]
name = "tolk-fuzz"
version = "0.0.0"
license = "AGPL-3.0-only"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64 = "0.23"
tolk-jmap = { path = ".." }

[[bin]]
name = "wbxml_decode"
path = "fuzz_targets/wbxml_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_parse"
path = "fuzz_targets/query_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timezone_blob"
path = "fuzz_targets/timezone_blob.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
